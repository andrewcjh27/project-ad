name: Refresh trends.json

# Builds trends.json server-side, where there is no CORS — so it can read the
# sources the static page cannot (Google Trends, Reddit, and YouTube when the
# optional YOUTUBE_API_KEY secret is set) on top of Apple's charts and Wikipedia.
# ad-studio.html prefers ./trends.json (tier 1) and falls back to its own browser
# fetches when the file is missing or stale, so this workflow is purely additive —
# nothing breaks if a run fails.
#
# Free: GitHub-hosted runner minutes are unlimited on public repositories.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6h, off-the-hour to avoid the scheduler rush
  workflow_dispatch:

permissions:
  contents: write # commit trends.json
  actions: write # dispatch the Pages deploy afterwards

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The safety rule is duplicated (browser JS + CI Python) out of necessity.
      # Fail before fetching rather than publish a feed that is laxer than the page
      # allows, or that derives a different hashtag than the page would.
      - name: Check browser/CI copies are in sync
        run: python3 scripts/check_safety_sync.py

      # stdlib only — no pip install step needed.
      # YOUTUBE_API_KEY is optional: without it the YouTube source is skipped and the
      # run still succeeds on the other feeds. It is a secret rather than a value in
      # the page because the published site is public — a key shipped in ad-studio.html
      # could be lifted and its quota burned by anyone.
      - name: Fetch trends
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Reddit returns "403 Blocked" for anonymous JSON from CI IPs, which took
          # out all 12 subject feeds on the first real run. A free read-only script
          # app is accepted from the same IPs. Optional: without these the Reddit
          # sources simply report the 403 and the rest of the run is unaffected.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python3 scripts/fetch_trends.py trends.json

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # STAGE FIRST, then compare the index against HEAD. `git diff` alone only
          # looks at TRACKED files, so while trends.json was untracked it reported
          # "no change" on every run — 32 green runs fetched the feed and silently
          # discarded it. `git diff --cached` sees a new file as an addition.
          git add trends.json
          if git diff --cached --quiet -- trends.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "trends.json unchanged — nothing to commit."
          else
            echo "staged $(wc -c < trends.json) bytes"
            git commit -m "chore: refresh trends.json [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does NOT trigger other workflows, so the
      # Pages deploy has to be asked for explicitly.
      - name: Deploy the refreshed feed to Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
